# === 电源与休眠 ===
CONFIG_ZMK_SLEEP=y
# 默认 15 分钟深睡，拉长到 30 分钟减少频繁唤醒重连等待
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# === 蓝牙稳定性与低延迟 ===
# 最大发射功率 (+8 dBm)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# 关闭 2M PHY、强制 1M PHY，提升抗干扰与 Windows/Intel 网卡稳定性
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# 修复 Windows 偶发“已连接但敲键无响应 / 重连卡住”
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# 主机链路（左手 <-> 电脑/手机）：锁定 7.5ms 间隔、降低跳帧、放宽超时容忍
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=5
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# 左右手分体链路（左手 <-> 右手）：降低右手延迟并防弱信号断连
CONFIG_ZMK_SPLIT_BLE_PREF_INT=6
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=5
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=600

# === 按键响应（Eager 去抖：按下 1ms / 释放 5ms，若轴体双击可改回 5） ===
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# === 显示屏基础开关 ===
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
